name: Generate contribution snake

# Replaces the old snake.yml + pacman.yml pair. Both pushed to the same `output`
# branch with crazy-max/ghaction-github-pages, which *replaces* the branch
# contents — so whichever ran last wiped the other one's SVG.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The first colour in color_dots is the *empty* cell. On dark it has to
          # be a visible slate (#2D3343) — anything near #0D1117 disappears
          # against GitHub's dark background and the grid looks broken.
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=0891B2&color_dots=#EBEDF0,#A5B4FC,#818CF8,#6366F1,#0891B2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=10B981&color_dots=#2D3343,#4B5563,#7C3AED,#A78BFA,#22D3EE

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
